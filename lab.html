<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f2f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4f2f'/%3E%3Ctext x='32' y='39' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3EACE%3C/text%3E%3C/svg%3E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Laboratório ACE">
  <title>ACE Campo - Análise de Tubitos</title>
  <style id="lab-v74-tablet-a11">
    :root {
      --lab-ink: #183c2c;
      --lab-text: #1b252e;
      --lab-muted: #66727c;
      --lab-bg: #eef2ef;
      --lab-card: #ffffff;
      --lab-brand: #0b4f2f;
      --lab-brand-soft: #128044;
      --lab-accent: #4c7cc5;
      --lab-warn: #c78615;
      --lab-border: rgba(24, 60, 44, .12);
      --lab-shadow: 0 12px 26px rgba(24, 60, 44, .08);
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--lab-text);
      background:
        radial-gradient(circle at top left, rgba(24, 60, 44, .12), transparent 24%),
        radial-gradient(circle at top right, rgba(53, 95, 159, .08), transparent 28%),
        linear-gradient(180deg, #edf4f0 0%, #e7efeb 210px, #edf2ef 100%);
      -webkit-font-smoothing: antialiased;
    }

    .lab-page {
      width: min(1040px, calc(100vw - 20px));
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 22px;
    }

    .lab-page-head {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 -10px 10px;
      padding: 12px 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 0 0 18px 18px;
      color: #fff;
      background:
        linear-gradient(120deg, rgba(8, 47, 32, .98), rgba(11, 79, 47, .98) 58%, rgba(18, 128, 68, .95)),
        radial-gradient(circle at top right, rgba(255, 255, 255, .10), transparent 36%);
      box-shadow: 0 12px 24px rgba(10, 32, 22, .20);
    }

    .lab-page-head::after {
      display: none;
    }

    .lab-page-head h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(1.08rem, 2.4vw, 1.34rem);
      line-height: 1.12;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lab-page-head__copy {
      min-width: 0;
    }

    .lab-online-chip {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-size: .78rem;
      font-weight: 950;
      white-space: nowrap;
    }

    .lab-page-note {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      margin-top: 5px;
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .86);
      box-shadow: none;
      font-size: .78rem;
      font-weight: 800;
      line-height: 1.18;
    }

    #labStandaloneRoot {
      display: block;
      width: 100%;
    }

    @media (max-width: 760px) {
      .lab-page {
        width: min(100% - 14px, 1040px);
        padding-top: 6px;
      }

      .lab-page-head {
        margin-inline: -7px;
        padding: 10px 11px;
        border-radius: 0 0 16px 16px;
      }

      .lab-page-note {
        font-size: .72rem;
      }
    }
  </style>
  <link rel="stylesheet" href="./assets/ace-ui-standard.css?v=20260521-v74-lab-a11">
</head>
<body class="ace-page ace-page--lab">
  <main class="lab-page ace-shell">
    <header class="lab-page-head ace-topbar">
      <div class="lab-page-head__copy">
        <h1>Análise de Tubitos</h1>
        <div class="lab-page-note ace-note">Use o codigo curto escrito no tubito, por exemplo: 2904-012-K7.</div>
      </div>
      <div class="lab-online-chip">Online</div>
    </header>

    <section id="labStandaloneRoot" data-lab-standalone="1"></section>
  </main>

  <script src="./assets/runtime-config.js?v=20260521-v74-lab-a11"></script>
  <script src="./assets/painel-laboratorio.js?v=20260521-v74-lab-a11"></script>
</body>
</html>
