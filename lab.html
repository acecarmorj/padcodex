<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE Campo - Análise de Tubitos</title>
  <style>
    :root {
      --lab-ink: #183c2c;
      --lab-text: #1b252e;
      --lab-muted: #66727c;
      --lab-bg: #eef2ef;
      --lab-card: #ffffff;
      --lab-brand: #21563c;
      --lab-brand-soft: #2f7a52;
      --lab-accent: #4c7cc5;
      --lab-warn: #c78615;
      --lab-border: rgba(24, 60, 44, .12);
      --lab-shadow: 0 18px 42px rgba(24, 60, 44, .10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--lab-text);
      background:
        radial-gradient(circle at top left, rgba(24, 60, 44, .16), transparent 24%),
        radial-gradient(circle at top right, rgba(53, 95, 159, .12), transparent 28%),
        linear-gradient(180deg, #edf4f0 0%, #e7efeb 230px, #edf2ef 100%);
    }

    .lab-page {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .lab-page-head {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 28px;
      color: #fff;
      background:
        linear-gradient(120deg, rgba(10, 43, 29, .96), rgba(15, 95, 47, .96) 56%, rgba(23, 107, 55, .94)),
        radial-gradient(circle at top right, rgba(255, 255, 255, .10), transparent 32%);
      box-shadow: 0 18px 42px rgba(10, 32, 22, .24);
    }

    .lab-page-head::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 5px;
      background: linear-gradient(90deg, #2f7a52, #4c7cc5 62%, #c78615);
    }

    .lab-page-head h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.35rem);
      letter-spacing: -.03em;
    }

    .lab-page-head p {
      max-width: 760px;
      margin: 7px 0 0;
      color: rgba(255, 255, 255, .82);
      line-height: 1.5;
      font-weight: 650;
    }

    .lab-page-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 12px 28px rgba(10, 32, 22, .18);
    }

    .lab-page-note {
      display: inline-flex;
      width: fit-content;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      box-shadow: 0 12px 26px rgba(10, 32, 22, .14);
      font-weight: 850;
    }

    @media (max-width: 760px) {
      .lab-page {
        width: min(100% - 22px, 1180px);
        padding-top: 14px;
      }

      .lab-page-head {
        flex-direction: column;
        border-radius: 22px;
      }

      .lab-page-link {
        width: 100%;
        min-height: 50px;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/ace-ui-standard.css?v=20260517-tablet-v55-final">
</head>
<body class="ace-page ace-page--lab">
  <main class="lab-page ace-shell">
    <header class="lab-page-head ace-topbar">
      <div>
        <h1>Análise de Tubitos</h1>
        <div class="lab-page-note ace-note">Use o codigo curto escrito no tubito, por exemplo: 2904-012-K7.</div>
      </div>
    </header>

    <section id="labStandaloneRoot" data-lab-standalone="1"></section>
  </main>

  <script src="./assets/runtime-config.js?v=20260502-role-v6"></script>
  <script src="./assets/painel-laboratorio.js?v=20260504-ace-standard-v3"></script>
</body>
</html>
